name: Compilar APK TV Paraguay

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descomprimir proyecto
        run: unzip -o TVParaguayAndroid-con-GitHub-Actions.zip

      - name: Compilar aplicación
        run: |
          find . -name gradlew -type f
          find . -name build.gradle -o -name build.gradle.kts
          
